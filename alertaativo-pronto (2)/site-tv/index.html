<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Conformidade — Treinamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif}
:root{
--bg:#0B1420;--panel:#141F30;--panel2:#182640;--border:#26364E;
--ink:#F4F7FB;--muted:#8CA0BC;
--blue:#3E7BFA;--blue-dim:#1F3A63;
--red:#FF5A5A;--red-dim:#3A1620;
--amber:#FFB648;--amber-dim:#3A2A0E;
--green:#3DDC84;
--display:'Chakra Petch',sans-serif;--mono:'IBM Plex Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
#root{height:100vh;display:flex;flex-direction:column;padding:clamp(18px,2.4vw,40px);gap:clamp(14px,1.6vw,26px)}

/* topo */
.topo{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.marca{display:flex;align-items:center;gap:16px}
.marca .selo{width:clamp(44px,4.2vw,62px);height:clamp(44px,4.2vw,62px);border-radius:14px;background:linear-gradient(145deg,var(--blue),#173A63);display:grid;place-items:center;font-size:clamp(22px,2.2vw,32px);box-shadow:0 10px 24px rgba(62,123,250,.25)}
.marca h1{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.1vw,32px);letter-spacing:-.2px}
.marca p{color:var(--muted);font-size:clamp(11px,1vw,14px);font-family:var(--mono);letter-spacing:.6px;margin-top:2px}
.relogio{text-align:right}
.relogio .hora{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.4vw,52px);line-height:1;letter-spacing:1px}
.relogio .data{color:var(--muted);font-size:clamp(11px,1.05vw,15px);margin-top:4px;text-transform:capitalize}

/* secao principal */
.secao-titulo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.secao-titulo h2{font-family:var(--display);font-weight:700;font-size:clamp(18px,2vw,28px);color:var(--red)}
.secao-titulo span{color:var(--muted);font-size:clamp(12px,1vw,15px)}

.grade{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(10px,1.1vw,18px);align-content:start;overflow:hidden}
.cartao{background:var(--panel);border:1px solid var(--border);border-left:6px solid var(--red);border-radius:12px;padding:clamp(14px,1.3vw,22px);display:flex;flex-direction:column;gap:10px;min-height:0}
.cartao .nome{font-family:var(--display);font-weight:700;font-size:clamp(17px,1.5vw,24px);line-height:1.15}
.cartao .cargo{color:var(--muted);font-size:clamp(11px,.9vw,14px);font-family:var(--mono)}
.cartao .itens{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.pilula{display:flex;justify-content:space-between;gap:10px;background:var(--red-dim);border-radius:8px;padding:7px 10px;font-size:clamp(11px,.9vw,14px)}
.pilula b{font-weight:600}
.pilula span{color:#FFB3B3;font-family:var(--mono);white-space:nowrap}
.pilula.prox{background:var(--amber-dim)}
.pilula.prox span{color:var(--amber)}

/* faixa secundaria */
.faixa{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px clamp(14px,1.4vw,22px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.faixa .rotulo{font-family:var(--mono);font-size:clamp(10px,.85vw,13px);color:var(--amber);letter-spacing:1px;white-space:nowrap}
.faixa .lista{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.chip{background:var(--amber-dim);color:var(--amber);border-radius:20px;padding:6px 12px;font-size:clamp(11px,.85vw,13px);white-space:nowrap}
.chip b{color:var(--ink)}

/* estados vazios / positivos */
.tudo-ok{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.tudo-ok .icone{font-size:clamp(48px,6vw,84px)}
.tudo-ok h2{font-family:var(--display);font-size:clamp(22px,2.6vw,38px);color:var(--green)}
.tudo-ok p{color:var(--muted);font-size:clamp(13px,1.1vw,16px)}

/* selecao de empresa */
.selecao{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.selecao h2{font-family:var(--display);font-size:clamp(20px,2vw,28px)}
.selecao .opcoes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:900px}
.selecao button{background:var(--panel);border:1px solid var(--border);color:var(--ink);font-family:var(--display);font-size:clamp(14px,1.1vw,18px);padding:16px 26px;border-radius:10px;cursor:pointer}
.selecao button:hover{border-color:var(--blue);background:var(--panel2)}

/* rodape / paginacao */
.rodape{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-family:var(--mono);font-size:clamp(10px,.85vw,12px)}
.pontos{display:flex;gap:7px}
.ponto{width:8px;height:8px;border-radius:50%;background:var(--border)}
.ponto.ativo{background:var(--blue)}
.trocar{background:none;border:0;color:var(--muted);font-family:var(--mono);font-size:inherit;cursor:pointer;text-decoration:underline}

.tela-cheia{position:fixed;right:16px;bottom:16px;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:17px;display:grid;place-items:center;opacity:.55}
.tela-cheia:hover{opacity:1;color:var(--ink)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<button class="tela-cheia" id="btnTelaCheia" title="Tela cheia" onclick="alternarTelaCheia()">⛶</button>

<script>
const STORAGE='controle_treinamentos_v3';
const CHAVE_EMPRESA='painel_tv_empresa_id';
const TAM_PAGINA=8;
const CICLO_PAGINA_MS=10000;
const ATUALIZA_DADOS_MS=6000;

function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function addMonths(date,months){const d=new Date(date+'T00:00:00');d.setMonth(d.getMonth()+Number(months||12));return d.toISOString().slice(0,10)}
function diffDias(date){return Math.ceil((new Date(date+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function plural(n,s,p){return Math.abs(n)===1?s:p}

async function carregarEstado(){
 const params=new URLSearchParams(location.search);
 const empresa=params.get('empresa')||'';
 const chave=params.get('chave')||'';
 if(!empresa||!chave) throw new Error('Link do painel inválido.');
 const api=`../backend/api/index.php?acao=painel&empresa=${encodeURIComponent(empresa)}&chave=${encodeURIComponent(chave)}`;
 const r=await fetch(api,{cache:'no-store'});
 const d=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(d.erro||'Não foi possível carregar o painel.');
 return d;
}

function empresaSelecionada(state){
 const empresas=Array.isArray(state.empresas)?state.empresas:[];
 if(!empresas.length)return {empresas,escolhida:null};
 const params=new URLSearchParams(location.search);
 const porUrl=params.get('empresa');
 if(porUrl){
  const alvo=porUrl.toLowerCase();
  const achada=empresas.find(e=>e.id===porUrl||(e.nome||'').toLowerCase()===alvo);
  if(achada){localStorage.setItem(CHAVE_EMPRESA,achada.id);return {empresas,escolhida:achada}}
 }
 const salva=localStorage.getItem(CHAVE_EMPRESA);
 if(salva){const achada=empresas.find(e=>e.id===salva);if(achada)return {empresas,escolhida:achada}}
 if(empresas.length===1)return {empresas,escolhida:empresas[0]};
 return {empresas,escolhida:null};
}

function escolherEmpresa(id){
 localStorage.setItem(CHAVE_EMPRESA,id);
 pagina=0;
 renderizar();
}
function trocarEmpresa(){
 localStorage.removeItem(CHAVE_EMPRESA);
 renderizar();
}

function registrosDaEmpresa(state,empresaId){
 const treinos=Array.isArray(state.treinamentos)?state.treinamentos:[];
 const colabs=Array.isArray(state.colaboradores)?state.colaboradores:[];
 const regs=Array.isArray(state.registros)?state.registros:[];
 const out=[];
 regs.forEach(r=>{
  const t=treinos.find(x=>x.id===r.treinamentoId);
  const c=colabs.find(x=>x.id===r.colaboradorId);
  if(!t||!c||c.empresaId!==empresaId)return;
  const venc=r.dataFim||addMonths(r.dataRealizacao,t.validade);
  out.push({nome:c.nome,cargo:c.funcao,matricula:c.matricula,treino:t.nome,venc,dias:diffDias(venc)});
 });
 return out;
}

function agruparPorPessoa(regs){
 const mapa=new Map();
 regs.forEach(r=>{
  const chave=r.nome+'|'+(r.matricula||'');
  if(!mapa.has(chave))mapa.set(chave,{nome:r.nome,cargo:r.cargo,matricula:r.matricula,itens:[]});
  mapa.get(chave).itens.push(r);
 });
 return [...mapa.values()];
}

let pagina=0;

function cartaoHtml(pessoa){
 const itens=pessoa.itens.sort((a,b)=>a.dias-b.dias);
 return `<div class="cartao">
  <div class="nome">${esc(pessoa.nome)}</div>
  <div class="cargo">${esc(pessoa.cargo||'—')}${pessoa.matricula?' • '+esc(pessoa.matricula):''}</div>
  <div class="itens">${itens.map(i=>`<div class="pilula"><b>${esc(i.treino)}</b><span>${i.dias===0?'vence hoje':`há ${Math.abs(i.dias)} ${plural(i.dias,'dia','dias')}`}</span></div>`).join('')}</div>
 </div>`;
}

async function renderizar(){
 const root=document.getElementById('root');
 try{
  const data=await carregarEstado();
  const empresa=data.empresa||{};
  const todos=(Array.isArray(data.registros)?data.registros:[]).map(r=>({...r,dias:diffDias(r.venc)}));
  const vencidos=agruparPorPessoa(todos.filter(r=>r.dias<=0)).sort((a,b)=>Math.min(...a.itens.map(i=>i.dias))-Math.min(...b.itens.map(i=>i.dias)));
  const proximos=todos.filter(r=>r.dias>0&&r.dias<=30).sort((a,b)=>a.dias-b.dias);

  const totalPaginas=Math.max(1,Math.ceil(vencidos.length/TAM_PAGINA));
  if(pagina>=totalPaginas)pagina=0;
  const pagina_atual=vencidos.slice(pagina*TAM_PAGINA,pagina*TAM_PAGINA+TAM_PAGINA);

  const agora=new Date();
  const topo=`<div class="topo">
    <div class="marca"><div class="selo">🛡️</div><div><h1>${esc(empresa.nome||'Alerta Ativo')}</h1><p>PAINEL DE CONFORMIDADE • TREINAMENTOS</p></div></div>
    <div class="relogio"><div class="hora">${agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div><div class="data">${agora.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div></div>
  </div>`;

  let corpo;
  if(!vencidos.length){
    corpo=`<div class="tudo-ok"><div class="icone">✅</div><h2>Nenhum treinamento vencido no momento</h2><p>Todos os colaboradores estão com os treinamentos em dia.</p></div>`;
  }else{
    corpo=`<div class="secao-titulo"><h2>⚠️ Treinamentos vencidos</h2><span>${vencidos.length} ${plural(vencidos.length,'colaborador','colaboradores')} precisam de atenção</span></div>
    <div class="grade">${pagina_atual.map(cartaoHtml).join('')}</div>`;
  }

  const faixa=proximos.length?`<div class="faixa"><span class="rotulo">VENCENDO EM ATÉ 30 DIAS</span><div class="lista">${proximos.slice(0,10).map(p=>`<span class="chip"><b>${esc(p.nome)}</b> — ${esc(p.treino)} (${p.dias} ${plural(p.dias,'dia','dias')})</span>`).join('')}</div></div>`:'';

  const rodape=`<div class="rodape">
    <span></span>
    ${totalPaginas>1?`<div class="pontos">${Array.from({length:totalPaginas}).map((_,i)=>`<div class="ponto ${i===pagina?'ativo':''}></div>`).join('')}</div>`:'<span></span>'}
    <span>atualizado às ${agora.toLocaleTimeString('pt-BR')}</span>
  </div>`;

  root.innerHTML=topo+corpo+faixa+rodape;
 }catch(e){
  root.innerHTML=`<div class="selecao"><h2>⚠️ Painel indisponível</h2><p style="color:var(--muted);max-width:620px;text-align:center;font-size:14px">${esc(e.message||'Erro ao carregar os dados.')}</p><p style="color:var(--muted);font-size:12px;margin-top:8px">Verifique o link da TV e a conexão com o servidor.</p></div>`;
 }
}

function alternarTelaCheia(){
 if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
 else document.exitFullscreen();
}

renderizar();
setInterval(renderizar,ATUALIZA_DADOS_MS);
setInterval(()=>{pagina++;renderizar()},CICLO_PAGINA_MS);

</script>
</body>
</html>
